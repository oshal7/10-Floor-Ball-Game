<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <title>Tilt10</title>
  <style>
    :root { --bg: #05060a; --fg: #e6ebf5; --dim: #8b94a8; --accent: #9ad8ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    main { max-width: 560px; width: 100%; text-align: center; }
    h1 { font-size: 56px; margin: 0 0 6px; letter-spacing: 0.06em; font-weight: 900; }
    h1 span { color: var(--accent); }
    .tag { color: var(--dim); margin: 0 0 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    a.card {
      display: block; text-align: left; text-decoration: none; color: inherit;
      padding: 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04); transition: background 0.2s, border-color 0.2s;
    }
    a.card:hover { background: rgba(255,255,255,0.08); border-color: rgba(154,216,255,0.5); }
    a.card.new { border-color: rgba(154,216,255,0.45); }
    .ver { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: var(--accent); }
    .card h2 { margin: 6px 0 8px; font-size: 20px; }
    .card p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>TILT<span>10</span></h1>
    <p class="tag">Ten floors down. Every ball you lose stays behind.</p>
    <div class="grid">
      <a class="card new" href="v2/">
        <div class="ver">V2 · NEW</div>
        <h2>Top-down dive</h2>
        <p>Look down the shaft and drop from board to board. The ball rolls toward your mouse or finger.</p>
      </a>
      <a class="card" href="v1/">
        <div class="ver">V1</div>
        <h2>Side-view descent</h2>
        <p>The original: a vertical shaft seen from the side, steered by tilting your phone.</p>
      </a>
    </div>
  </main>
</body>
</html>
